services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sentraguard-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      - GUARDRAILS_API_KEY=${GUARDRAILS_API_KEY:-}
      - GUARDRAILS_REQUIRE_AUTH=${GUARDRAILS_REQUIRE_AUTH:-false}
      - GUARDRAILS_RATE_LIMIT_REQUESTS=${GUARDRAILS_RATE_LIMIT_REQUESTS:-60}
      - GUARDRAILS_RATE_LIMIT_WINDOW_SECONDS=${GUARDRAILS_RATE_LIMIT_WINDOW_SECONDS:-60}
      - GUARDRAILS_MAX_REQUEST_BODY_BYTES=${GUARDRAILS_MAX_REQUEST_BODY_BYTES:-1048576}
      - GUARDRAILS_TRUSTED_PROXIES=${GUARDRAILS_TRUSTED_PROXIES:-}

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: sentraguard-ui
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Base address only - the UI appends /analyze itself.
      API_URL: http://api:8000
      GUARDRAILS_API_KEY: ${GUARDRAILS_API_KEY:-}
    restart: unless-stopped
