name: SentraGuard CI

on:
  push:
    branches: [main, "feature/**", "hardening/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run Python tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (Docker image) and the newest used for development.
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.api.txt
            requirements.dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.api.txt
          pip install -r requirements.dev.txt

      - name: Run test suite with coverage
        run: python -m pytest -m "not e2e" --cov=app --cov-report=term-missing --cov-fail-under=95 -v

  browser-e2e:
    name: Browser E2E Tests (Playwright / Chromium / Python 3.11)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.api.txt
            requirements.ui.txt
            requirements.dev.txt

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.api.txt
          pip install -r requirements.ui.txt
          pip install -r requirements.dev.txt
          pip install playwright pytest-playwright
          playwright install --with-deps chromium

      - name: Start services and run Browser E2E tests
        env:
          GUARDRAILS_REQUIRE_AUTH: "true"
          GUARDRAILS_ALLOW_ANONYMOUS: "false"
          API_URL: http://127.0.0.1:8000
          GUARDRAILS_UI_ALLOW_ANONYMOUS: "false"
          STREAMLIT_SERVER_HEADLESS: "true"
          TEST_UI_URL: http://127.0.0.1:8501
          CI: "true"
          CI_E2E: "true"
        run: |
          set -eo pipefail

          # Generate dynamic isolated ephemeral test credentials for this CI run
          export GUARDRAILS_API_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          export TEST_GUARDRAILS_API_KEY="$GUARDRAILS_API_KEY"
          export GUARDRAILS_UI_PASSWORD="$(python -c 'import secrets; print(secrets.token_hex(16))')"
          export TEST_GUARDRAILS_UI_PASSWORD="$GUARDRAILS_UI_PASSWORD"

          LOG_DIR="/tmp/sentraguard-e2e-logs"
          mkdir -p "$LOG_DIR"
          API_LOG="$LOG_DIR/api.log"
          UI_LOG="$LOG_DIR/ui.log"
          TEST_LOG="$LOG_DIR/pytest-e2e.log"

          cleanup() {
            echo "Stopping background services..."
            if [ -n "$API_PID" ] && kill -0 "$API_PID" 2>/dev/null; then
              kill "$API_PID" 2>/dev/null || true
            fi
            if [ -n "$UI_PID" ] && kill -0 "$UI_PID" 2>/dev/null; then
              kill "$UI_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          wait_for_service() {
            local url="$1"
            local name="$2"
            local timeout="${3:-30}"
            local logfile="$4"

            python -c "
          import sys, time, urllib.request
          url, name, timeout = sys.argv[1], sys.argv[2], int(sys.argv[3])
          start = time.time()
          while time.time() - start < timeout:
              try:
                  if urllib.request.urlopen(url, timeout=2).status == 200:
                      print(f'Ready: {name} responded 200 on {url} (in {time.time() - start:.1f}s)')
                      sys.exit(0)
              except Exception:
                  pass
              time.sleep(0.5)
          print(f'Error: {name} did not become ready at {url} within {timeout}s', file=sys.stderr)
          sys.exit(1)
          " "$url" "$name" "$timeout" || {
              echo "=== $name failed to start within ${timeout}s ==="
              if [ -f "$logfile" ]; then
                echo "--- Tail of $logfile ---"
                tail -n 50 "$logfile"
              fi
              exit 1
            }
          }

          echo "Starting Gateway API in background..."
          uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-server-header > "$API_LOG" 2>&1 &
          API_PID=$!

          wait_for_service "http://127.0.0.1:8000/health" "Gateway API" 30 "$API_LOG"

          echo "Starting Streamlit UI in background..."
          streamlit run ui/streamlit_app.py --server.address 127.0.0.1 --server.port 8501 > "$UI_LOG" 2>&1 &
          UI_PID=$!

          wait_for_service "http://127.0.0.1:8501/_stcore/health" "Streamlit UI" 30 "$UI_LOG"

          echo "Running Playwright browser tests..."
          pytest -m e2e tests/test_ui_e2e.py -v | tee "$TEST_LOG"

          # Verify that CI cannot pass if tests were skipped or fewer than 6 executed
          grep -E "6 passed" "$TEST_LOG" >/dev/null || {
            echo "ERROR: Expected 6 passed browser tests, but got different result."
            exit 1
          }
