name: SentraGuard Security

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

jobs:
  bandit:
    name: Python static security analysis (Bandit)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.api.txt
            requirements.dev.txt

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Scan Python code
        run: bandit -r app cli.py -ll

  dependency-audit:
    name: Dependency vulnerability audit (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.api.txt
            requirements.dev.txt
            requirements.ui.txt

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit API and dev dependencies
        run: pip-audit --desc -r requirements.api.txt -r requirements.dev.txt

      # The Streamlit UI pulls a large transitive tree (Pillow, protobuf, ...)
      # that ships in the UI image, so it is audited separately.
      - name: Audit UI dependencies
        run: pip-audit --desc -r requirements.ui.txt

      - name: Audit optional Redis dependency
        run: pip-audit --desc -r requirements.redis.txt

  secret-scan:
    name: Secret detection (TruffleHog)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          path: ./
          extra_args: --only-verified
