name: SentraGuard Security

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

jobs:
  bandit:
    name: Python static security analysis (Bandit)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.api.txt
            requirements.dev.txt

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Scan Python code
        run: bandit -r app cli.py -ll

  dependency-audit:
    name: Dependency vulnerability audit (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.api.txt
            requirements.dev.txt
            requirements.ui.txt

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit API and dev dependencies
        run: pip-audit --desc -r requirements.api.txt -r requirements.dev.txt

      # The Streamlit UI pulls a large transitive tree (Pillow, protobuf, ...)
      # that ships in the UI image, so it is audited separately.
      - name: Audit UI dependencies
        run: pip-audit --desc -r requirements.ui.txt

      - name: Audit optional Redis dependency
        run: pip-audit --desc -r requirements.redis.txt

  secret-scan:
    name: Secret detection (TruffleHog)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: trufflesecurity/trufflehog@c85580b712841eda4c53bc28fc6ace6100e8c16c # v3.99.4
        with:
          path: ./
          extra_args: --only-verified
